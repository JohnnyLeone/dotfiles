# Original C-z prefix, splits, numbering, and colors with current tmux options.
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-kitty:RGB'
set -g prefix C-z
unbind C-b
bind C-z last-window
bind z send-prefix
set -g mouse on
set -g history-limit 30000
set -s escape-time 50
setw -g mode-keys vi
unbind %
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
set -g set-titles on
set -g set-titles-string '#T'
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-style 'bg=#666666,fg=#aaaaaa'
setw -g window-status-style 'fg=colour6,bg=default'
setw -g automatic-rename on
setw -g window-status-current-format '|#I:#W|'
setw -g window-status-current-style 'fg=colour4,bg=default'
set -g pane-border-style 'fg=colour235'
set -g pane-active-border-style 'fg=colour240'
bind r source-file ~/.tmux.conf \; display-message 'Config reloaded'
if-shell 'test -r ~/.tmux.conf.local' 'source-file ~/.tmux.conf.local'
