# Keep Kitty as the terminal, with the old Zsh workflow.
shell /usr/bin/zsh
font_family monospace
font_size 11.0
scrollback_lines 30000
enable_audio_bell no
background #000000
foreground #b7bfd8
cursor #6f8fd6
selection_background #2a3040
selection_foreground #b7bfd8
background_opacity 1.0
# Optional private/per-machine settings; missing includes are allowed by Kitty.
include local.conf
