# Stereo voice/chat playback to the Ui24R's zero-based USB channels AUX4/5.
context.modules = [
  {
    name = libpipewire-module-loopback
    args = {
      node.description = "Ui24R Voice (AUX 4/5)"

      capture.props = {
        node.name = "ui24r_aux45"
        node.description = "Ui24R Voice (AUX 4/5)"
        media.class = "Audio/Sink"
        audio.position = [ FL FR ]
      }

      playback.props = {
        node.name = "playback.ui24r_aux45"
        target.object = "alsa_output.usb-Soundcraft_Soundcraft_Ui24-00.pro-output-0"
        audio.position = [ AUX4 AUX5 ]

        stream.dont-remix = true
        node.passive = true
      }
    }
  }
]
