# Stereo music playback to the Ui24R's zero-based USB channels AUX2/3.
context.modules = [
  {
    name = libpipewire-module-loopback
    args = {
      node.description = "Ui24R Music (AUX 2/3)"

      capture.props = {
        node.name = "ui24r_aux23"
        node.description = "Ui24R Music (AUX 2/3)"
        media.class = "Audio/Sink"
        audio.position = [ FL FR ]
      }

      playback.props = {
        node.name = "playback.ui24r_aux23"
        target.object = "alsa_output.usb-Soundcraft_Soundcraft_Ui24-00.pro-output-0"
        audio.position = [ AUX2 AUX3 ]

        stream.dont-remix = true
        node.passive = true
      }
    }
  }
]
