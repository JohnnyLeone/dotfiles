general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    # Keep normal video/presentation inhibition for locking and screen power.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
}

# Hide static bar elements after one minute, even while media inhibits locking.
# The helper restores only a bar it hid; a manually hidden bar stays hidden.
listener {
    timeout = 60
    on-timeout = ~/.local/bin/dotfiles-bar idle-hide
    on-resume = ~/.local/bin/dotfiles-bar idle-resume
    ignore_inhibit = true
}

# Dim the ASUS OLED by 20 brightness points (normally 70 -> 50).
# Respect media/presentation inhibitors; restore the previous value on input.
listener {
    timeout = 60
    on-timeout = ~/.local/bin/dotfiles-oled idle-dim
    on-resume = ~/.local/bin/dotfiles-oled idle-resume
}

# OLED protection: lock at three minutes, then turn the panel off at four.
listener {
    timeout = 180
    on-timeout = loginctl lock-session
}

listener {
    timeout = 240
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
