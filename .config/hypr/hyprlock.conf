# OLED-friendly lock screen. Clear input with Escape, Ctrl+U, or Ctrl+Backspace.

$font = Monospace

general {
    hide_cursor = true
}

animations {
    enabled = false
}

background {
    monitor =
    path =
    color = rgba(0, 0, 0, 1.0)
    blur_passes = 0
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.35)

    outer_color = rgba(6f8fd6cc) rgba(80a45fcc) 45deg
    check_color = rgba(80a45fcc) rgba(c08a4acc) 120deg
    fail_color = rgba(d06775cc) rgba(b85f7acc) 40deg

    font_color = rgb(183, 191, 216)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL

    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 48
    color = rgb(596171)
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 16
    color = rgb(596171)
    font_family = $font

    position = -30, -150
    halign = right
    valign = top
}
